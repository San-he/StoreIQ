server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # gzip 压缩：1M 带宽下显著加速前端包/GeoJSON 加载
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vue Router history 模式：静态文件优先，其余回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口反向代理（同源部署：前端与后端同域名，无跨域/混合内容问题）
    # 覆盖所有业务前缀 + Knife4j 文档路径
    location ~ ^/(auth|stores|products|categories|inventory|purchase|sale|stats|suppliers|users|logs|notifications|ai|cleanup|doc|webjars|v3) {
        proxy_pass http://backend:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
